<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal OpenAI Responses Demo + File Upload</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 680px; }
    textarea { width: 100%; height: 6rem; }
    button { margin-top: .5rem; padding: .4rem .8rem; }
    #responseArea, #statusArea { white-space: pre-wrap; margin-top: 1rem; }
    #statusArea.error { color: red; }
  </style>
</head>
<body>
  <h1>Minimal OpenAI Responses Demo&nbsp;+&nbsp;File&nbsp;Upload</h1>

  <!-- USER QUESTION -->
  <h3>Ask a question</h3>
  <textarea id="questionInput" placeholder="Type your question…"></textarea>
  <br />
  <button id="sendBtn">Send</button>

  <!-- FILE UPLOAD -->
  <h3>Optional: add files the assistant can read</h3>
  <input id="fileInput" type="file" multiple />
  <button id="uploadBtn">Upload</button>

  <!-- STATUS / ANSWER AREAS -->
  <div id="statusArea"></div>
  <pre id="responseArea"></pre>

  <script>
    const sendBtn   = document.getElementById("sendBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const qInput    = document.getElementById("questionInput");
    const statusEl  = document.getElementById("statusArea");
    const respEl    = document.getElementById("responseArea");

    /* ------------- SEND QUESTION ------------- */
    sendBtn.onclick = async () => {
      const message = qInput.value.trim();
      if (!message) return;

      statusEl.textContent = "…thinking…";
      statusEl.classList.remove("error");
      respEl.textContent = "";

      try {
        const res  = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        respEl.textContent = data.answer;
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.classList.add("error");
      }
    };

    /* ------------- UPLOAD FILES ------------- */
    uploadBtn.onclick = async () => {
      const files = document.getElementById("fileInput").files;
      if (!files.length) {
        alert("Choose at least one file first!");
        return;
      }

      statusEl.textContent = `Uploading ${files.length} file(s)…`;
      statusEl.classList.remove("error");

      try {
        const form = new FormData();
        [...files].forEach(f => form.append("files", f));

        const res  = await fetch("/api/upload", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Upload failed");

        statusEl.textContent =
          `✓ Uploaded! ${data.uploadedIds.length} file(s) added to knowledge base.`;
        document.getElementById("fileInput").value = "";
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.classList.add("error");
      }
    };
  </script>
</body>
</html>
